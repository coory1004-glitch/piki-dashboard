<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Piki · 작업 현황</title>
<style>
  :root {
    --bg: #0b1220;
    --bg-soft: #111c2e;
    --card: #16233a;
    --card-hover: #1b2a45;
    --line: rgba(148, 163, 184, 0.16);
    --line-strong: rgba(148, 163, 184, 0.28);
    --text: #e8eefb;
    --text-soft: #a9b8d0;
    --text-dim: #7b8ba6;
    --accent: #5b9dff;
    --accent-soft: rgba(91, 157, 255, 0.14);
    --running: #34d399;
    --running-bg: rgba(52, 211, 153, 0.14);
    --sched: #a78bfa;
    --sched-bg: rgba(167, 139, 250, 0.14);
    --done: #94a3b8;
    --done-bg: rgba(148, 163, 184, 0.14);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fb;
      --bg-soft: #ffffff;
      --card: #ffffff;
      --card-hover: #ffffff;
      --line: rgba(15, 23, 42, 0.08);
      --line-strong: rgba(15, 23, 42, 0.16);
      --text: #0f172a;
      --text-soft: #475569;
      --text-dim: #7a8798;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --running: #059669;
      --running-bg: rgba(5, 150, 105, 0.10);
      --sched: #7c3aed;
      --sched-bg: rgba(124, 58, 237, 0.10);
      --done: #64748b;
      --done-bg: rgba(100, 116, 139, 0.10);
      --shadow: 0 1px 2px rgba(15,23,42,.05), 0 10px 30px -18px rgba(15,23,42,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1000px 480px at 80% -10%, rgba(91,157,255,.14), transparent 60%),
      radial-gradient(800px 400px at 0% 0%, rgba(167,139,250,.10), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                 "Segoe UI", Roboto, "Helvetica Neue", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    font-size: 15px;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 calc(32px + env(safe-area-inset-bottom));
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ── header ─────────────────────────────── */
  header {
    padding: 28px 0 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }
  .brand .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--running);
    box-shadow: 0 0 0 4px var(--running-bg);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }
  .title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
  }
  h1 {
    font-size: 26px;
    line-height: 1.25;
    margin: 0;
    letter-spacing: -.03em;
    font-weight: 750;
  }
  h1 span { color: var(--accent); }
  .updated {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .updated b { color: var(--text-soft); font-weight: 600; }
  .refresh {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 13px;
    border: 1px solid var(--line-strong);
    background: var(--bg-soft);
    color: var(--text-soft);
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .refresh:hover { background: var(--card-hover); color: var(--text); border-color: var(--accent); }
  .refresh:active { transform: scale(.94); }
  .refresh svg { width: 19px; height: 19px; }
  .refresh.spin svg { animation: spin .7s cubic-bezier(.5,.1,.3,1); }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ── summary ────────────────────────────── */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 18px 0 26px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 12px 13px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .stat::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--stat-color, var(--accent));
    opacity: .85;
  }
  .stat .n {
    font-size: 25px;
    font-weight: 750;
    letter-spacing: -.03em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .stat .n small { font-size: 12px; font-weight: 600; color: var(--text-dim); margin-left: 2px; }
  .stat .k {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 5px;
    font-weight: 550;
  }

  /* ── sections ───────────────────────────── */
  section { margin-bottom: 26px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 12px 2px;
  }
  .sec-head h2 {
    font-size: 13px;
    margin: 0;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-soft);
    font-weight: 700;
  }
  .sec-head .count {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .list { display: grid; gap: 10px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    transition: border-color .18s ease, transform .18s ease, background .18s ease;
  }
  .card:hover { border-color: var(--line-strong); background: var(--card-hover); }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .card-title {
    font-size: 15.5px;
    font-weight: 650;
    letter-spacing: -.01em;
    margin: 0;
    color: var(--text);
    word-break: keep-all;
  }
  .badge {
    flex: none;
    font-size: 11.5px;
    font-weight: 650;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
    letter-spacing: -.01em;
    margin-top: 1px;
  }
  .badge.running { color: var(--running); background: var(--running-bg); }
  .badge.sched   { color: var(--sched);   background: var(--sched-bg); }
  .badge.done    { color: var(--done);    background: var(--done-bg); }

  .card-body { margin-top: 10px; }
  .progress-text {
    font-size: 13.5px;
    color: var(--text-soft);
    word-break: keep-all;
  }
  .bar {
    margin-top: 10px;
    height: 6px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--running), #4ade80);
    width: 0;
    transition: width .9s cubic-bezier(.2,.8,.2,1);
  }
  .bar-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .when {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    margin-top: 8px;
    font-size: 13.5px;
  }
  .when .time {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 13px;
  }
  .when .plus {
    color: var(--text-soft);
    font-size: 12.5px;
  }
  .when .plus::before {
    content: "＋";
    color: var(--text-dim);
    margin-right: 4px;
    font-size: 11px;
  }
  .note {
    margin-top: 8px;
    font-size: 13.5px;
    color: var(--text-soft);
    word-break: keep-all;
  }
  .note .tick { color: var(--running); font-weight: 700; margin-right: 2px; }

  /* ── states ─────────────────────────────── */
  #error {
    display: none;
    margin: 18px 0;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(248, 113, 113, .32);
    background: rgba(248, 113, 113, .10);
    color: #fda4a4;
    font-size: 13.5px;
  }
  @media (prefers-color-scheme: light) {
    #error { color: #b91c1c; }
  }
  .skeleton .card { opacity: .55; }
  .empty {
    padding: 40px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  footer {
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  footer .auto { display: flex; align-items: center; gap: 6px; }
  footer .auto i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--running); display: inline-block;
  }

  @media (max-width: 380px) {
    h1 { font-size: 23px; }
    .stat .n { font-size: 22px; }
    .stat .k { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>Piki · Live Status</div>
    <div class="title-row">
      <div>
        <h1>작업 <span>현황</span> 대시보드</h1>
        <div class="updated">업데이트 <b id="updated-at">—</b></div>
      </div>
      <button class="refresh" id="refresh" aria-label="새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
          <path d="M21 3v6h-6"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="summary" id="summary">
    <div class="stat" style="--stat-color: var(--running)">
      <div class="n" id="c-active">–</div>
      <div class="k">진행 중</div>
    </div>
    <div class="stat" style="--stat-color: var(--sched)">
      <div class="n" id="c-sched">–</div>
      <div class="k">정기 실행</div>
    </div>
    <div class="stat" style="--stat-color: var(--done)">
      <div class="n" id="c-pending">–</div>
      <div class="k">대기 · 완료</div>
    </div>
  </div>

  <div id="error"></div>

  <main id="app" class="skeleton">
    <div class="empty">불러오는 중…</div>
  </main>

  <footer>
    <span>piki-dashboard</span>
    <span class="auto"><i></i>5분마다 자동 새로고침</span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var REFRESH_MS = 5 * 60 * 1000;
  var app = document.getElementById("app");
  var errBox = document.getElementById("error");
  var updatedEl = document.getElementById("updated-at");
  var btn = document.getElementById("refresh");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function clampPct(done, total) {
    var d = Number(done), t = Number(total);
    if (!isFinite(d) || !isFinite(t) || t <= 0) return null;
    return Math.max(0, Math.min(100, Math.round((d / t) * 100)));
  }

  function activeCard(item) {
    var card = el("article", "card");
    var top = el("div", "card-top");
    top.appendChild(el("h3", "card-title", item.title || ""));
    top.appendChild(el("span", "badge running", item.status || "진행 중"));
    card.appendChild(top);

    var body = el("div", "card-body");
    if (item.progress) body.appendChild(el("div", "progress-text", item.progress));

    var pct = clampPct(item.done, item.total);
    if (pct !== null) {
      var bar = el("div", "bar");
      var fill = el("i");
      bar.appendChild(fill);
      body.appendChild(bar);

      var meta = el("div", "bar-meta");
      meta.appendChild(el("span", null, pct + "%"));
      meta.appendChild(el("span", null, item.done + " / " + item.total));
      body.appendChild(meta);

      requestAnimationFrame(function () {
        requestAnimationFrame(function () { fill.style.width = pct + "%"; });
      });
    }
    card.appendChild(body);
    return card;
  }

  function scheduledCard(item) {
    var card = el("article", "card");
    var top = el("div", "card-top");
    top.appendChild(el("h3", "card-title", item.title || ""));
    var recurring = (item.schedule || "").indexOf("매일") === 0;
    top.appendChild(el("span", "badge sched", recurring ? "정기" : "예정"));
    card.appendChild(top);

    var when = el("div", "when");
    if (item.schedule) when.appendChild(el("span", "time", item.schedule));
    if (item.note) when.appendChild(el("span", "plus", item.note));
    card.appendChild(when);
    return card;
  }

  function pendingCard(item) {
    var card = el("article", "card");
    var top = el("div", "card-top");
    top.appendChild(el("h3", "card-title", item.title || ""));
    var note = item.note || "";
    var isDone = note.indexOf("완료") === 0;
    if (isDone) note = note.replace(/^완료\s*/, "");
    top.appendChild(el("span", "badge " + (isDone ? "done" : "sched"), isDone ? "완료" : "대기"));
    card.appendChild(top);

    if (note) card.appendChild(el("div", "note", note));
    return card;
  }

  function section(title, count, items, builder) {
    var s = el("section");
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, title));
    head.appendChild(el("span", "count", "(" + count + ")"));
    s.appendChild(head);

    var list = el("div", "list");
    if (!items || !items.length) {
      list.appendChild(el("div", "empty", "표시할 항목이 없습니다."));
    } else {
      items.forEach(function (it) { list.appendChild(builder(it)); });
    }
    s.appendChild(list);
    return s;
  }

  function render(data) {
    app.className = "";
    app.textContent = "";

    var active = Array.isArray(data.active) ? data.active : [];
    var sched = Array.isArray(data.scheduled) ? data.scheduled : [];
    var pending = Array.isArray(data.pending) ? data.pending : [];

    document.getElementById("c-active").textContent = active.length;
    document.getElementById("c-sched").textContent = sched.length;
    document.getElementById("c-pending").textContent = pending.length;
    updatedEl.textContent = data.updated_at || "—";

    app.appendChild(section("진행 중", active.length, active, activeCard));
    app.appendChild(section("정기 실행 · 예정 알림", sched.length, sched, scheduledCard));
    app.appendChild(section("대기 · 완료", pending.length, pending, pendingCard));
    document.title = "Piki · 작업 현황";
  }

  function fail(msg) {
    errBox.style.display = "block";
    errBox.textContent = msg;
  }

  // A standalone copy (dashboard.html) ships the data inline so it also works offline / from file://.
  function readEmbedded() {
    var node = document.getElementById("embedded-data");
    if (!node) return null;
    try { return JSON.parse(node.textContent); } catch (e) { return null; }
  }

  function load() {
    btn.classList.add("spin");
    var local = readEmbedded();
    if (local) {
      errBox.style.display = "none";
      render(local);
      setTimeout(function () { btn.classList.remove("spin"); }, 500);
      return;
    }
    fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        errBox.style.display = "none";
        render(data);
      })
      .catch(function (e) {
        fail("데이터를 불러오지 못했습니다 (" + e.message + "). 잠시 후 새로고침해 주세요.");
        if (!app.querySelector(".card")) {
          app.className = "";
          app.textContent = "";
          app.appendChild(el("div", "empty", "데이터 없음"));
        }
      })
      .finally(function () {
        setTimeout(function () { btn.classList.remove("spin"); }, 700);
      });
  }

  btn.addEventListener("click", load);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load();
  });

  load();
  setInterval(function () {
    if (!document.hidden) load();
  }, REFRESH_MS);
})();
</script>
</body>
</html>
